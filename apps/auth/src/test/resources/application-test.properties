# Integration tests exercise PNPG's shared User Registry key, so the Mongo producer
# needs a test-only client route for every supported tenant. Production auth keeps PNPG unrouted.
tenant.registry.json={"AR":{"frontend_uri":"https://selfcare.pagopa.it","api_uri":"https://api.selfcare.pagopa.it","allowed_origins":["https://selfcare.pagopa.it"],"authentication_provider":"ONE_IDENTITY","auth_enabled":true,"mongo":{"account":"cosmos-ar","database":"selcAuth","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"oneIdentity":{"clientIdEnvVar":"TENANT_AR_ONE_IDENTITY_CLIENT_ID","clientSecretEnvVar":"TENANT_AR_ONE_IDENTITY_CLIENT_SECRET"},"userRegistry":{"apiKeyEnvVar":"USER_REGISTRY_API_KEY_AR"}},"PNPG":{"frontend_uri":"https://imprese.notifichedigitali.it","api_uri":"https://api-pnpg.selfcare.pagopa.it","allowed_origins":["https://imprese.notifichedigitali.it"],"authentication_provider":"HUB_SPID_LOGIN","auth_enabled":false,"mongo":{"account":"cosmos-pnpg-test","database":"selcAuth","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_PNPG"},"userRegistry":{"apiKeyEnvVar":"USER_REGISTRY_API_KEY_PNPG"}}}
USER_REGISTRY_API_KEY_AR=123
USER_REGISTRY_API_KEY_PNPG=456
TENANT_AR_ONE_IDENTITY_CLIENT_ID=id
TENANT_AR_ONE_IDENTITY_CLIENT_SECRET=secret
tenant.ar.jwt.session.private-key=${jwt.session.private.key}
tenant.ar.jwt.session.key-id=jwt_test_kid
