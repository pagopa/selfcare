# These properties are used to run integration tests

quarkus.index-dependency.selfcare-steps.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-steps.artifact-id=selfcare-cucumber-sdk

tenant.supported-tenants=AR,PNPG
MONGODB_CONNECTION_STRING_AR=mongodb://localhost:27017
MONGODB_CONNECTION_STRING_PNPG=mongodb://localhost:27017

quarkus.rest-client."org.openapi.quarkus.user_registry_json.api.UserApi".url=http://localhost:1080/user-registry-mock/v1
quarkus.rest-client."tenant.user-registry".url=http://localhost:1080/user-registry-mock/v1

quarkus.rest-client."org.openapi.quarkus.one_identity_json.api.DefaultApi".url=http://localhost:1080/one-identity-mock/v1

user-ms.blob-storage.container-templates=resources
user-ms.blob-storage.container-product=products
user-ms.blob-storage.connection-string-product=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCD9I1QhZT4gRjAAHEDPazjFIwtg==;BlobEndpoint=http://localhost:10000/devstoreaccount1;
user-ms.blob-storage.connection-string-templates=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCD9I1QhZT4gRjAAHEDPazjFIwtg==;BlobEndpoint=http://localhost:10000/devstoreaccount1;

internal.user-api.key=example-api-key
internal.user-ms.api.key=example-api-key
internal.user-api/mp-rest/url=http://localhost:8081/mock-apim
internal.user-ms.api/mp-rest/url=http://localhost:8080
tenant.ar.one-mail.api-key=example-api-key
one_mail.api/mp-rest/url=http://localhost:1080/onemail-mock/
