services:
  mongodb:
    platform: linux/amd64
    image: mongo@sha256:406a4fdca9fc763443268f000218d3849ef8996f66ed9e92ba0b501b446ab822
    ports:
      - "27017:27017"
    volumes:
      - "./db:/docker-entrypoint-initdb.d"
    networks:
      - develop-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    ports:
      - "10000:10000"
    command: "azurite --blobHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCD9I1QhZT4gRjAAHEDPazjFIwtg==
    networks:
      - develop-network

  azure-cli:
    image: mcr.microsoft.com/azure-cli:latest
    depends_on:
      - azurite
    networks:
      - develop-network
    volumes:
      - "./blobStorageInit/initAzurite.sh:/initAzurite.sh"
      - "./blobStorageInit/products.json:/workspace/products.json"
      - "../../../../../infra/core/resources:/workspace/resources/resources"
    command: ["/bin/sh", "-c", "/initAzurite.sh"]
    environment:
      - SELFCARE_INFRA_PRIVATE_ENV=dev

  mockserver:
    platform: linux/amd64
    image: mockserver/mockserver@sha256:adec675a93253dcd503cda331dbc8c88383c1c79ceb2370ec9766ad3f010d255
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/*.json
      - MOCKSERVER_ENABLE_CORS_FOR_API="true"
      - MOCKSERVER_ENABLE_CORS_FOR_ALL_RESPONSES="true"
    volumes:
      - "./mock:/config"
    networks:
      - develop-network

  userms:
    image: ghcr.io/pagopa/selfcare-user-ms:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - "./userenv"
    networks:
      - develop-network
    depends_on:
      mongodb:
        condition: service_started
      azure-cli:
        condition: service_completed_successfully
      mockserver:
        condition: service_started

  institutionms:
    image: ghcr.io/pagopa/selfcare-institution-ms:latest
    platform: linux/amd64
    ports:
      - "8083:8083"
    env_file:
      - "./institutionenv"
    networks:
      - develop-network
    depends_on:
      mongodb:
        condition: service_started
      azure-cli:
        condition: service_completed_successfully
      mockserver:
        condition: service_started

  iamms:
    image: ghcr.io/pagopa/selfcare-iam-ms:latest
    platform: linux/amd64
    ports:
      - "8085:8085"
    env_file:
      - "./iamenv"
    networks:
      - develop-network
    depends_on:
      mongodb:
        condition: service_started
      mockserver:
        condition: service_started

networks:
  develop-network:
    name: selfcare-auth-develop-network
