# Application
quarkus.application.name=webhook-service
quarkus.http.port=8080
quarkus.banner.path=banner.txt
# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n
# MongoDB
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE_NAME:selcWebhook}
# Quarkus creates both a reactive and a sync client; cap each pool so Netty direct buffers stay bounded.
quarkus.mongodb.max-pool-size=${MONGODB_MAX_POOL_SIZE:20}
quarkus.mongodb.min-pool-size=0
# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.store-schema-directory=src/main/docs
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Webhook Service API
mp.openapi.extensions.smallrye.info.version=0.1.0
mp.openapi.extensions.smallrye.info.description=API per la gestione e invio di notifiche via webhook HTTP
# Security / JWT
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
smallrye.jwt.claims.sub=uid
# Health
quarkus.smallrye-health.root-path=/q/health
# REST Client
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
# Webhook Configuration
webhook.retry.max-attempts=${WEBHOOK_RETRY_MAX_ATTEMPTS:3}
webhook.retry.initial-delay=${WEBHOOK_RETRY_INITIAL_DELAY:1000}
webhook.retry.max-delay=${WEBHOOK_RETRY_MAX_DELAY:10000}
webhook.timeout.connect=${WEBHOOK_TIMEOUT_CONNECT:5000}
webhook.timeout.read=${WEBHOOK_TIMEOUT_READ:10000}
webhook.http.max-pool-size=${WEBHOOK_HTTP_MAX_POOL_SIZE:10}
webhook.http.max-wait-queue-size=${WEBHOOK_HTTP_MAX_WAIT_QUEUE_SIZE:50}
webhook.http.max-concurrent-deliveries=${WEBHOOK_HTTP_MAX_CONCURRENT_DELIVERIES:10}
webhook.jwt.private-key=${WEBHOOK_JWT_PRIVATE_KEY}
webhook.jwt.issuer=${WEBHOOK_JWT_ISSUER:PAGOPA}
webhook.jwt.audience=${WEBHOOK_JWT_AUDIENCE:selfcare-webhook}
webhook.jwt.duration-minutes=${WEBHOOK_JWT_DURATION_MINUTES:5}
webhook.jwt.header-name=${WEBHOOK_JWT_HEADER_NAME:Authorization}
webhook.jwt.header-prefix=${WEBHOOK_JWT_HEADER_PREFIX:Bearer }
# Storage Queue
webhook.storage-queue.enabled=${WEBHOOK_STORAGE_QUEUE_ENABLED:false}
webhook.storage-queue.endpoint=${WEBHOOK_STORAGE_QUEUE_ENDPOINT:http://localhost}
webhook.storage-queue.queue=${WEBHOOK_STORAGE_QUEUE_NAME:webhook-notifications}
webhook.storage-queue.connection-string=${WEBHOOK_STORAGE_QUEUE_CONNECTION_STRING:none}
# Queue creation is handled by Terraform in the cloud, where the managed identity only holds
# message level roles: enable this only for local/emulator setups.
webhook.storage-queue.auto-create=${WEBHOOK_STORAGE_QUEUE_AUTO_CREATE:false}
webhook.storage-queue.max-messages-per-poll=${WEBHOOK_STORAGE_QUEUE_MAX_MESSAGES_PER_POLL:32}
webhook.storage-queue.max-in-flight=${WEBHOOK_STORAGE_QUEUE_MAX_IN_FLIGHT:32}
webhook.storage-queue.visibility-timeout-seconds=${WEBHOOK_STORAGE_QUEUE_VISIBILITY_TIMEOUT_SECONDS:300}
webhook.storage-queue.poll-interval=${WEBHOOK_STORAGE_QUEUE_POLL_INTERVAL:5s}
webhook.storage-queue.outbox-interval=${WEBHOOK_STORAGE_QUEUE_OUTBOX_INTERVAL:30s}
webhook.storage-queue.outbox-lag-threshold-seconds=${WEBHOOK_STORAGE_QUEUE_OUTBOX_LAG_THRESHOLD_SECONDS:300}
# Metrics are emitted through the OpenTelemetry API only. The SDK and the exporter are provided
# at runtime by the Application Insights Java agent (JAVA_TOOL_OPTIONS=-javaagent:...), so no
# OTel SDK/exporter configuration is needed here. When no agent is attached (dev/test) the API
# resolves to a no-op implementation and the instruments simply do nothing.
### ENCRYPTION PUB KEY
selfcare.data.encryption.key=${SELFCARE_DATA_ENCRIPTION_KEY:0123456789ABCDEF0123456789ABCDEF}
selfcare.data.encryption.iv=${SELFCARE_DATA_ENCRIPTION_IV:bXy0jvL2z6TtXQ==}
## Jacoco
%test.quarkus.jacoco.data-file=target/jacoco.exec
