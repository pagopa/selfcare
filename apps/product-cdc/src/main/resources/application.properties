quarkus.http.port=8080
quarkus.banner.path=banner.txt
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:""}
smallrye.jwt.claims.sub=uid

quarkus.log.level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n

quarkus.http.limits.max-form-attribute-size=4096

quarkus.smallrye-openapi.open-api-version=3.0.3

product-cdc.mongodb.collection=${MONGODB_COLLECTION_NAME:testcollection}
product-cdc.mongodb.watch.enabled=${PRODUCT-CDC-MONGODB-WATCH-ENABLED:true}
product-cdc.appinsights.connection-string=${APPLICATIONINSIGHTS_CONNECTION_STRING:InstrumentationKey=00000000-0000-0000-0000-000000000000}
product-cdc.table.name=${START_AT_TABLE_NAME:CdCStartAt}
product-cdc.storage.connection-string=${STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true;}

product-cdc.retry.min-backoff=${PRODUCT-CDC-RETRY-MIN-BACKOFF:1}
product-cdc.retry.max-backoff=${PRODUCT-CDC-RETRY-MAX-BACKOFF:2}
product-cdc.retry=${PRODUCT-CDC-RETRY:3}
product-cdc.minutes-threshold-for-update-notification=${PRODUCT-CDC-MINUTES-THRESHOLD-FOR-UPDATE-NOTIFICATION:5}
### AZURE STORAGE ##
product-cdc.blob-storage.filepath-product=${PRODUCT_STORAGE_FILE_NAME:products.json}
tenant.registry.json={"AR":{"mongo":{"account":"cosmos-ar","database":"selcProduct","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"storages":{"products":{"account":"products","container":"products","pathPrefix":"","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_CONN_STRING_PRODUCT_AR"}}}},"PNPG":{"mongo":{"account":"cosmos-pnpg","database":"selcProduct","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_PNPG"},"storages":{"products":{"account":"products","container":"products","pathPrefix":"","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_CONN_STRING_PRODUCT_PNPG"}}}}}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR,PNPG}
tenant.storage.mandatory-keys=products
quarkus.index-dependency.selfcare-sdk-tenant.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant.artifact-id=selfcare-sdk-tenant
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.artifact-id=selfcare-sdk-tenant-mongodb

