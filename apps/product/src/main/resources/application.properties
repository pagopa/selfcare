quarkus.http.port=8080
quarkus.banner.path=banner.txt
# mp.jwt.verify.publickey is a legacy fallback: JWTCallerPrincipalFactory prefers
# per-tenant keys from tenant.registry.json jwt.publicKeyEnvVar.
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:NONE}
smallrye.jwt.claims.sub=uid
#quarkus.smallrye-jwt.blocking-authentication=true
quarkus.http.limits.max-body-size=1M
# NOTE: do not wrap tenant.registry.json in ${TENANT_REGISTRY_JSON:...}. SmallRye
# Config miscounts nested braces. The TENANT_REGISTRY_JSON env var still overrides
# this property via standard Quarkus env mapping.
tenant.registry.json={"AR":{"mongo":{"account":"cosmos-ar","database":"selcProduct","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_AR"},"storages":{"contracts":{"account":"documents-storage","container":"sc-d-documents-blob","pathPrefix":"","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_CONNECTION_STRING_CONTRACT_TEMPLATE_AR"}}}},"PNPG":{"mongo":{"account":"cosmos-pnpg","database":"selcProduct","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_PNPG"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_PNPG"},"storages":{"contracts":{"account":"documents-storage","container":"sc-d-documents-blob","pathPrefix":"","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_CONNECTION_STRING_CONTRACT_TEMPLATE_PNPG"}}}}}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR,PNPG}
tenant.enforcement.enabled=${TENANT_ENFORCEMENT_ENABLED:true}
%test.tenant.enforcement.enabled=false
tenant.default=${TENANT_DEFAULT:AR}
%test.tenant.default=AR
tenant.storage.mandatory-keys=${TENANT_STORAGE_MANDATORY_KEYS:contracts}
# Skip eager Azure client creation in tests (BlobServiceClientBuilder needs CDI Vertx).
%test.tenant.storage.eager-init=false
# Do not set quarkus.mongodb.connection-string or @MongoEntity(clientName):
# TenantMongoClientProducer replaces the default Panache client.
quarkus.index-dependency.selfcare-sdk-security.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-security.artifact-id=selfcare-sdk-security
quarkus.index-dependency.selfcare-sdk-tenant.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant.artifact-id=selfcare-sdk-tenant
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.artifact-id=selfcare-sdk-tenant-mongodb
quarkus.index-dependency.selfcare-sdk-health.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-health.artifact-id=selfcare-sdk-health
## HEALTH
quarkus.smallrye-health.root-path=/q/health
quarkus.mongodb.health.enabled=false
## Contract Template
product-ms.contract-template.logo-base-url=${CONTRACT_TEMPLATE_LOGO_BASE_URL:https://selfcare.pagopa.it/resources/products}
## JWT
quarkus.http.auth.proactive=false
## OPEN API ##
quarkus.smallrye-openapi.info-title=Product API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.store-schema-directory=src/main/docs
## LOGGING ##
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n

quarkus.http.limits.max-form-attribute-size=4096
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
#quarkus.native.resources.includes=publicKey.pem
## SIGNATURE
## Rest Client
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=200
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
quarkus.openapi-generator.codegen.validateSpec=false
## Jacoco
%test.quarkus.jacoco.includes=it/pagopa/selfcare/product/controller/*,it/pagopa/selfcare/product/service/**,it/pagopa/selfcare/product/util/**,it/pagopa/selfcare/product/health/**,it/pagopa/selfcare/product/filter/**,it/pagopa/selfcare/product/storage/**
%test.quarkus.jacoco.excludes=it/pagopa/selfcare/product/service/ProductService.class,it/pagopa/selfcare/product/service/ProductServiceDefault*,it/pagopa/selfcare/product/service/ProductServiceCacheable*
%test.quarkus.jacoco.data-file=target/jacoco.exec
product-ms.retry.min-backoff=${PRODUCT_MS_RETRY_MIN_BACKOFF:5}
product-ms.retry.max-backoff=${PRODUCT_MS_RETRY_MAX_BACKOFF:60}
product-ms.retry=${PRODUCT_MS_RETRY:3}
product-ms.appinsights.connection-string=${APPLICATIONINSIGHTS_CONNECTION_STRING:InstrumentationKey=00000000-0000-0000-0000-000000000000}
### ENCRYPTION PUB KEY
selfcare.data.encryption.key=${SELFCARE_DATA_ENCRIPTION_KEY:0123456789ABCDEF0123456789ABCDEF}
selfcare.data.encryption.iv=${SELFCARE_DATA_ENCRIPTION_IV:bXy0jvL2z6TtXQ==}
