spring.data.mongodb.uri=${MONGODB_CONNECTION_URI:mongodb://localhost:27017/?readPreference=primary&appname=MongoDB%20Compass&directConnection=true&ssl=false}&appname=${MONGODB_APPNAME:selcMsCore}
spring.data.mongodb.database=${MONGODB_NAME_SELC_MSCORE:selcMsCore}
INSTITUTION_MONGODB_CONNECTION=${spring.data.mongodb.uri}
INSTITUTION_JWT_PUBLIC_KEY=${jwt.signingKey}
tenant.mongodb.enabled=${TENANT_MONGODB_ENABLED:true}
tenant.mongodb.application-name=${MONGODB_APPNAME:selcMsCore}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR}
tenant.default=${TENANT_DEFAULT:AR}
tenant.strict-data-isolation=${TENANT_STRICT_DATA_ISOLATION:true}
tenant.registry.json=${SELFCARE_TENANT_DATA_ISOLATION:{"AR":{"mongo":{"account":"local","database":"${spring.data.mongodb.database}","connectionStringEnvVar":"INSTITUTION_MONGODB_CONNECTION"},"jwt":{"publicKeyEnvVar":"INSTITUTION_JWT_PUBLIC_KEY"},"storages":{}}}}
