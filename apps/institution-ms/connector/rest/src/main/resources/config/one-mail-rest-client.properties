rest-client.one-mail.base-url=${ONE_MAIL_URL:http://localhost:8080}
rest-client.one-mail.x-api-key=${ONE_MAIL_API_KEY:example-api-key}
rest-client.one-mail.sender=${ONE_MAIL_SENDER_ADDRESS:noreply@selfcare.pagopa.it}

spring.cloud.openfeign.client.config.one-mail.connectTimeout=${ONE_MAIL_REST_CLIENT_CONNECT_TIMEOUT:1000}
spring.cloud.openfeign.client.config.one-mail.readTimeout=${ONE_MAIL_REST_CLIENT_READ_TIMEOUT:2000}
# BASIC avoids logging the x-api-key header and recipients' email addresses
spring.cloud.openfeign.client.config.one-mail.loggerLevel=${ONE_MAIL_REST_CLIENT_LOGGER_LEVEL:BASIC}
