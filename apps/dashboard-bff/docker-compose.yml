version: "3.8"
services:
  mockserver:
    image: mockserver/mockserver@sha256:adec675a93253dcd503cda331dbc8c88383c1c79ceb2370ec9766ad3f010d255
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/*.json
      - MOCKSERVER_ENABLE_CORS_FOR_API="true"
      - MOCKSERVER_ENABLE_CORS_FOR_ALL_RESPONSES="true"
    volumes:
      - "./integration-test-config/mock:/config"
    networks:
      - develop-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    ports:
      - "10000:10000"
    command: "azurite --blobHost 0.0.0.0 --inMemoryPersistence"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCD9I1QhZT4gRjAAHEDPazjFIwtg==
    networks:
      - develop-network

  azure-cli:
    build:
      context: "."
      dockerfile: "integration-test-config/azure-cli/Dockerfile-azure-cli"
    depends_on:
      - azurite
    networks:
      - develop-network
    volumes:
      - "./integration-test-config/blobStorageInit/initAzurite.sh:/initAzurite.sh"
      - "./integration-test-config/blobStorageInit/signed_IO_accordo_adesione.pdf:/workspace/signed_IO_accordo_adesione.pdf"
      - "./integration-test-config/blobStorageInit/products.json:/workspace/products.json"
    environment:
      - SELFCARE_INFRA_PRIVATE_ENV=dev

  mongodb:
    image: mongo@sha256:1cb283500219e8fc0b61b328ea5a199a395a753d88b17351c58874fb425223cb
    ports:
      - "27017:27017"
    volumes:
      - "./integration-test-config/db:/docker-entrypoint-initdb.d"
    networks:
      - develop-network

  userms:
    image: ghcr.io/pagopa/selfcare-user-ms:latest@sha256:91d95b836f728ec02f73200d845f3cb2362354c8fff8fa07dc877f31b8e09603
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8081:8080"
    env_file:
      - "./src/test/resources/userenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

  onboardingms:
    image: ghcr.io/pagopa/selfcare-onboarding-ms:latest@sha256:3e145ecb747f150de017bbaa009ed8e1ab23a60159075e42d7afd6f0fe03dd4a
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - "./src/test/resources/onboardingenv"
    networks:
      - develop-network
    depends_on:
      - mongodb
      - productms

  documentms:
    image: ghcr.io/pagopa/selfcare-document-ms:latest@sha256:cb3d6b00101ec420ca602a46052cea7c542d6f789afdbc89234ea9ba39e4100c
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8086:8080"
    env_file:
      - "./src/test/resources/documentenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

  institutionms:
    image: ghcr.io/pagopa/selfcare-institution-ms:latest@sha256:92c663516273a99257ef736b701caf95acb431ee96ee9adda755cdabde0774a2
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8082:8082"
    env_file:
      - "./src/test/resources/institutionenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

  usergroupms:
    image: ghcr.io/pagopa/selfcare-user-group-ms:latest@sha256:de4e772d7ff58a885e855f7fa9068c26fe68ffe354adcdd18952c5f6597dca4e
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8083:8083"
    env_file:
      - "./src/test/resources/usergroupenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

  iamms:
    image: ghcr.io/pagopa/selfcare-iam-ms:latest@sha256:5a21cbef4f5067a382d46c13437cf7a42b49a58e413ed8df27d047e2cc95d968
    pull_policy: always
    platform: linux/amd64
    ports:
      - "8085:8080"
    env_file:
      - "./src/test/resources/iamenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

  productms:
    image: ghcr.io/pagopa/selfcare-product-ms:latest@sha256:357a53fe1ee06fe6e24cae40d731d1f599656ef12237565dd00b553699570f17
    pull_policy: always
    platform: linux/amd64
    env_file:
      - "./src/test/resources/productenv"
    networks:
      - develop-network
    depends_on:
      - mongodb

networks:
  develop-network:
    name: selfcare-develop-network-dashboard-bff
