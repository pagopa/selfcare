---
openapi: 3.1.0
components:
  schemas:
    AdditionalInformations:
      type: object
      properties:
        belongRegulatedMarket:
          type: boolean
          description: "${openapi.onboarding.institutions.model.additionalInformations.belongRegulatedMarket}"
        regulatedMarketNote:
          type: string
          description: "${openapi.onboarding.institutions.model.additionalInformations.regulatedMarketNote}"
        ipa:
          type: boolean
          description: "${openapi.onboarding.institutions.model.additionalInformations.ipa}"
        ipaCode:
          type: string
          description: "${openapi.onboarding.institutions.model.additionalInformations.ipaCode}"
        establishedByRegulatoryProvision:
          type: boolean
          description: "${openapi.onboarding.institutions.model.additionalInformations.establishedByRegulatoryProvision}"
        establishedByRegulatoryProvisionNote:
          type: string
          description: "${openapi.onboarding.institutions.model.additionalInformations.establishedByRegulatoryProvisionNote}"
        agentOfPublicService:
          type: boolean
          description: "${openapi.onboarding.institutions.model.additionalInformations.agentOfPublicService}"
        agentOfPublicServiceNote:
          type: string
          description: "${openapi.onboarding.institutions.model.additionalInformations.agentOfPublicServiceNote}"
        otherNote:
          type: string
          description: "${openapi.onboarding.institutions.model.additionalInformations.otherNote}"
    AdditionalInformationsDto:
      type: object
      properties:
        belongRegulatedMarket:
          type: boolean
          description: "${openapi.onboarding.institutions.model.assistance.belongRegulatedMarket}"
        regulatedMarketNote:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.regulatedMarketNote}"
        ipa:
          type: boolean
          description: "${openapi.onboarding.institutions.model.assistance.ipa}"
        ipaCode:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.ipaCode}"
        establishedByRegulatoryProvision:
          type: boolean
          description: "${openapi.onboarding.institutions.model.assistance.establishedByRegulatoryProvision}"
        establishedByRegulatoryProvisionNote:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.establishedByRegulatoryProvisionNote}"
        agentOfPublicService:
          type: boolean
          description: "${openapi.onboarding.institutions.model.assistance.agentOfPublicService}"
        agentOfPublicServiceNote:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.agentOfPublicServiceNote}"
        otherNote:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.otherNote}"
    AggregateInstitution:
      type: object
      required:
      - taxCode
      - description
      properties:
        taxCode:
          type: string
        description:
          type: string
        subunitCode:
          type: string
        subunitType:
          type: string
        geographicTaxonomies:
          type: array
          items:
            $ref: "#/components/schemas/GeographicTaxonomyDto1"
        address:
          type: string
        zipCode:
          type: string
        originId:
          type: string
        origin:
          $ref: "#/components/schemas/Origin"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        iban:
          type: string
        recipientCode:
          type: string
        vatNumber:
          type: string
        digitalAddress:
          type: string
        city:
          type: string
        county:
          type: string
        parentDescription:
          type: string
    AggregateResult:
      type: object
      properties:
        subunitCode:
          type: string
        subunitType:
          type: string
        description:
          type: string
        recipientCode:
          type: string
        digitalAddress:
          type: string
        taxCode:
          type: string
        vatNumber:
          type: string
        address:
          type: string
        city:
          type: string
        county:
          type: string
        zipCode:
          type: string
        originId:
          type: string
        origin:
          type: string
        iban:
          type: string
        parentDescription:
          type: string
        users:
          type: array
          items:
            $ref: "#/components/schemas/AggregateUserResult"
    AggregateUserResult:
      type: object
      properties:
        name:
          type: string
        surname:
          type: string
        taxCode:
          type: string
        email:
          type: string
        role:
          type: string
    AssistanceContactsDto:
      type: object
      properties:
        supportEmail:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.supportEmail}"
        supportPhone:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.supportPhone}"
    AssistanceContactsResource:
      type: object
      properties:
        supportEmail:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.supportEmail}"
        supportPhone:
          type: string
          description: "${openapi.onboarding.institutions.model.assistance.supportPhone}"
    AvailableDocumentsResource:
      description: Aggregated list of documents available for download for a given
        onboarding.
      type: object
      properties:
        attachments:
          type: array
          items:
            type: string
          description: Names of the attachments available for the onboarding. Empty
            list if none.
        contractFilename:
          type: string
          description: Filename of the signed contract available for download. Null
            when the onboarding has no signed contract yet (e.g. state TOBEVALIDATED).
    Billing:
      type: object
      properties:
        vatNumber:
          type: string
        recipientCode:
          type: string
        publicServices:
          type: boolean
        taxCodeInvoicing:
          type: string
    BillingDataDto:
      type: object
      required:
      - businessName
      - registeredOffice
      - digitalAddress
      properties:
        businessName:
          type: string
          description: "${openapi.onboarding.institutions.model.name}"
          pattern: \S
        registeredOffice:
          type: string
          description: "${openapi.onboarding.institutions.model.address}"
          pattern: \S
        digitalAddress:
          type: string
          description: "${openapi.onboarding.institutions.model.digitalAddress}"
          pattern: \S
        zipCode:
          type: string
          description: "${openapi.onboarding.institutions.model.zipCode}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        taxCodeInvoicing:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCodeInvoicing}"
        vatNumber:
          type: string
          description: "${openapi.onboarding.institutions.model.vatNumber}"
        recipientCode:
          type: string
          description: "${openapi.onboarding.institutions.model.recipientCode}"
        publicServices:
          type: boolean
          description: "${openapi.onboarding.institutions.model.publicServices}"
        certified:
          type: boolean
          description: "${openapi.onboarding.institutions.model.certified}"
        legalForm:
          type: string
          description: "${openapi.onboarding.institutions.model.legalForm}"
    BillingDataResponseDto:
      type: object
      properties:
        businessName:
          type: string
          description: "${openapi.onboarding.institutions.model.name}"
        registeredOffice:
          type: string
          description: "${openapi.onboarding.institutions.model.address}"
        digitalAddress:
          type: string
          description: "${openapi.onboarding.institutions.model.digitalAddress}"
        zipCode:
          type: string
          description: "${openapi.onboarding.institutions.model.zipCode}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        vatNumber:
          type: string
          description: "${openapi.onboarding.institutions.model.vatNumber}"
        recipientCode:
          type: string
          description: "${openapi.onboarding.institutions.model.recipientCode}"
        publicServices:
          type: boolean
          description: "${openapi.onboarding.institutions.model.publicServices}"
        certified:
          type: boolean
          description: "${openapi.onboarding.institutions.model.certified}"
    BusinessResourceIC:
      type: object
      properties:
        businessName:
          type: string
          description: "${openapi.onboarding.institutions.businessIc.model.businessName}"
        businessTaxId:
          type: string
          description: "${openapi.onboarding.institutions.businessIc.model.businessTaxId}"
    CheckManagerDto:
      type: object
      required:
      - userId
      - productId
      properties:
        userId:
          description: "${openapi.onboarding.institutions.model.userId}"
          type: string
          $ref: "#/components/schemas/UUID"
        institutionType:
          description: "${openapi.onboarding.institutions.model.institutionType}"
          type: string
          $ref: "#/components/schemas/InstitutionType"
        origin:
          type: string
          description: "${openapi.onboarding.institutions.model.origin}"
        originId:
          type: string
          description: "${openapi.onboarding.institutions.model.originId}"
        productId:
          type: string
          description: "${openapi.onboarding.product.model.id}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        subunitCode:
          type: string
          description: "${openapi.onboarding.institutions.model.subunitCode}"
    CompanyBillingDataDto:
      type: object
      required:
      - businessName
      - taxCode
      - certified
      properties:
        businessName:
          type: string
          description: "${openapi.onboarding.institutions.model.name}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
          pattern: \S
        certified:
          type: boolean
          description: "${openapi.onboarding.institutions.model.certified}"
        digitalAddress:
          type: string
          description: "${openapi.onboarding.institutions.model.digitalAddress}"
    CompanyInformationsDto:
      type: object
      properties:
        rea:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.rea}"
        shareCapital:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.shareCapital}"
        businessRegisterPlace:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.businessRegisterPlace}"
    CompanyInformationsResource:
      type: object
      properties:
        rea:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.rea}"
        shareCapital:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.shareCapital}"
        businessRegisterPlace:
          type: string
          description: "${openapi.onboarding.institutions.model.companyInformations.businessRegisterPlace}"
    CompanyOnboardingDto:
      type: object
      required:
      - users
      - billingData
      - institutionType
      - productId
      - taxCode
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/CompanyUserDto"
          description: "${openapi.onboarding.institutions.model.users}"
          minItems: 1
        billingData:
          description: "${openapi.onboarding.institutions.model.billingData}"
          type: object
          $ref: "#/components/schemas/CompanyBillingDataDto"
        institutionType:
          description: "${openapi.onboarding.institutions.model.institutionType}"
          type: string
          $ref: "#/components/schemas/InstitutionType"
        productId:
          type: string
          description: "${openapi.onboarding.product.model.id}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
    CompanyOnboardingUserDto:
      type: object
      required:
      - users
      - institutionType
      - productId
      - taxCode
      - certified
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/CompanyUserDto"
          description: "${openapi.onboarding.institutions.model.users}"
          minItems: 1
        institutionType:
          description: "${openapi.onboarding.institutions.model.institutionType}"
          type: string
          $ref: "#/components/schemas/InstitutionType"
        productId:
          type: string
          description: "${openapi.onboarding.product.model.id}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        certified:
          type: boolean
          description: "${openapi.onboarding.institutions.model.certified}"
    CompanyUserDto:
      type: object
      required:
      - name
      - surname
      - taxCode
      - role
      properties:
        name:
          type: string
          description: "${openapi.onboarding.user.model.name}"
          pattern: \S
        surname:
          type: string
          description: "${openapi.onboarding.user.model.surname}"
          pattern: \S
        email:
          type: string
          description: "${openapi.onboarding.user.model.email}"
        taxCode:
          type: string
          description: "${openapi.onboarding.user.model.fiscalCode}"
          pattern: \S
        role:
          description: "${openapi.onboarding.user.model.role}"
          type: string
          $ref: "#/components/schemas/PartyRole"
    DataProtectionOfficer:
      type: object
      properties:
        address:
          type: string
        email:
          type: string
        pec:
          type: string
    DownloadDocumentType:
      description: Type of document to download.
      type: string
      enum:
      - CONTRACT_SIGNED
      - ATTACHMENT
    DpoData:
      type: object
      required:
      - address
      - pec
      - email
      properties:
        address:
          type: string
          description: "${openapi.onboarding.institutions.model.dpoData.address}"
          pattern: \S
        pec:
          type: string
          description: "${openapi.onboarding.institutions.model.dpoData.pec}"
          pattern: \S
        email:
          type: string
          description: "${openapi.onboarding.institutions.model.dpoData.email}"
          pattern: \S
    DpoDataDto:
      type: object
      required:
      - address
      - pec
      - email
      properties:
        address:
          type: string
          description: "${openapi.onboarding.institutions.model.pspData.dpoData.address}"
          pattern: \S
        pec:
          type: string
          description: "${openapi.onboarding.institutions.model.pspData.dpoData.pec}"
          pattern: \S
        email:
          type: string
          description: "${openapi.onboarding.institutions.model.pspData.dpoData.email}"
          pattern: \S
    GPUData:
      type: object
      properties:
        businessRegisterNumber:
          type: string
        legalRegisterNumber:
          type: string
        legalRegisterName:
          type: string
        longTermPayments:
          type: boolean
        manager:
          type: boolean
        managerAuthorized:
          type: boolean
        managerEligible:
          type: boolean
        managerProsecution:
          type: boolean
        institutionCourtMeasures:
          type: boolean
    GeographicTaxonomyDto:
      type: object
      required:
      - code
      - desc
      properties:
        code:
          type: string
          description: "${openapi.onboarding.geographicTaxonomy.model.code}"
          pattern: \S
        desc:
          type: string
          description: "${openapi.onboarding.geographicTaxonomy.model.desc}"
          pattern: \S
    GeographicTaxonomyDto1:
      type: object
      properties:
        code:
          type: string
        desc:
          type: string
    GeographicTaxonomyResource:
      type: object
      properties:
        code:
          type: string
          description: "${openapi.onboarding.geographicTaxonomy.model.code}"
        desc:
          type: string
          description: "${openapi.onboarding.geographicTaxonomy.model.desc}"
    InstitutionData:
      type: object
      properties:
        id:
          type: string
          description: "${openapi.onboarding.institutions.model.id}"
        institutionType:
          description: "${openapi.onboarding.institutions.model.institutionType}"
          type: string
          $ref: "#/components/schemas/InstitutionType"
        billingData:
          description: "${openapi.onboarding.institutions.model.billingData}"
          type: object
          $ref: "#/components/schemas/BillingDataResponseDto"
        city:
          type: string
          description: "${openapi.onboarding.institutions.model.city}"
        county:
          type: string
          description: "${openapi.onboarding.institutions.model.county}"
        country:
          type: string
          description: "${openapi.onboarding.institutions.model.country}"
        origin:
          type: string
        originId:
          type: string
        paymentServiceProvider:
          description: "${openapi.onboarding.institutions.model.paymentServiceProvider}"
          type: object
          $ref: "#/components/schemas/PaymentServiceProvider"
        dataProtectionOfficer:
          description: "${openapi.onboarding.institutions.model.dataProtectionOfficer}"
          type: object
          $ref: "#/components/schemas/DataProtectionOfficer"
        gpuData:
          description: "${openapi.onboarding.institutions.model.gpuData}"
          type: object
          $ref: "#/components/schemas/GPUData"
        companyInformations:
          description: "${openapi.onboarding.institutions.model.companyInformations}"
          type: object
          $ref: "#/components/schemas/CompanyInformationsResource"
        assistanceContacts:
          description: "${openapi.onboarding.institutions.model.assistance}"
          type: object
          $ref: "#/components/schemas/AssistanceContactsResource"
    InstitutionInfo:
      type: object
      properties:
        id:
          type: string
          description: "${openapi.onboarding.institutions.model.id}"
        name:
          type: string
          description: "${openapi.onboarding.institutions.model.name}"
        institutionType:
          type: string
          description: "${openapi.onboarding.institutions.model.institutionType}"
        address:
          type: string
          description: "${openapi.onboarding.institutions.model.address}"
        zipCode:
          type: string
          description: "${openapi.onboarding.institutions.model.zipCode}"
        city:
          type: string
          description: "${openapi.onboarding.institutions.model.city}"
        country:
          type: string
          description: "${openapi.onboarding.institutions.model.country}"
        county:
          type: string
          description: "${openapi.onboarding.institutions.model.county}"
        mailAddress:
          type: string
          description: "${openapi.onboarding.institutions.model.digitalAddress}"
        fiscalCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        taxCodeInvoicing:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCodeInvoicing}"
        vatNumber:
          type: string
          description: "${openapi.onboarding.institutions.model.vatNumber}"
        recipientCode:
          type: string
          description: "${openapi.onboarding.institutions.model.recipientCode}"
        pspData:
          description: "${openapi.onboarding.institutions.model.pspData}"
          type: object
          $ref: "#/components/schemas/PspData"
        dpoData:
          description: "${openapi.onboarding.institutions.model.dpoData}"
          type: object
          $ref: "#/components/schemas/DpoData"
        additionalInformations:
          description: "${openapi.onboarding.institutions.model.additionalInformations}"
          type: object
          $ref: "#/components/schemas/AdditionalInformations"
      required:
      - name
      - institutionType
      - address
      - zipCode
      - mailAddress
      - fiscalCode
      - vatNumber
    InstitutionLegalAddressResource:
      type: object
      properties:
        address:
          type: string
          description: "${openapi.onboarding.institutions.model.address}"
        zipCode:
          type: string
          description: "${openapi.onboarding.institutions.model.zipCode}"
    InstitutionLocationDataDto:
      type: object
      properties:
        city:
          type: string
          description: "${openapi.onboarding.institutions.model.city}"
        county:
          type: string
          description: "${openapi.onboarding.institutions.model.county}"
        country:
          type: string
          description: "${openapi.onboarding.institutions.model.country}"
    InstitutionOnboarding:
      type: object
      properties:
        productId:
          type: string
        tokenId:
          type: string
        status:
          type: string
        contract:
          type: string
        pricingPlan:
          type: string
        billing:
          $ref: "#/components/schemas/Billing"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        updatedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        closedAt:
          $ref: "#/components/schemas/OffsetDateTime"
    InstitutionOnboardingInfoResource:
      type: object
      properties:
        institution:
          description: "${openapi.onboarding.institutions.model.institutionData}"
          type: object
          $ref: "#/components/schemas/InstitutionData"
        geographicTaxonomies:
          type: array
          items:
            $ref: "#/components/schemas/GeographicTaxonomyResource"
          description: "${openapi.onboarding.institutions.model.geographicTaxonomy}"
    InstitutionOnboardingResource:
      type: object
      properties:
        institutionId:
          type: string
        businessName:
          type: string
        onboardings:
          type: array
          items:
            $ref: "#/components/schemas/InstitutionOnboarding"
    InstitutionResource:
      type: object
      properties:
        id:
          description: "${openapi.onboarding.institutions.model.id}"
          type: string
          $ref: "#/components/schemas/UUID"
        description:
          type: string
          description: "${openapi.onboarding.institutions.model.name}"
        parentDescription:
          type: string
          description: "${openapi.onboarding.institutions.model.parentDescription}"
        externalId:
          type: string
          description: "${openapi.onboarding.institutions.model.externalId}"
        originId:
          type: string
          description: "${openapi.onboarding.institutions.model.originId}"
        institutionType:
          type: string
          description: "${openapi.onboarding.institutions.model.institutionType}"
        digitalAddress:
          type: string
          description: "${openapi.onboarding.institutions.model.digitalAddress}"
        address:
          type: string
          description: "${openapi.onboarding.institutions.model.address}"
        zipCode:
          type: string
          description: "${openapi.onboarding.institutions.model.zipCode}"
        city:
          type: string
          description: "${openapi.onboarding.institutions.model.city}"
        county:
          type: string
          description: "${openapi.onboarding.institutions.model.county}"
        country:
          type: string
          description: "${openapi.onboarding.institutions.model.country}"
        taxCode:
          type: string
          description: "${openapi.onboarding.institutions.model.taxCode}"
        origin:
          type: string
          description: "${openapi.onboarding.institutions.model.origin}"
        userRole:
          description: "${openapi.onboarding.institutions.model.userRole}"
          type: string
          $ref: "#/components/schemas/UserAuthority"
    InstitutionResourceIC:
      type: object
      properties:
        legalTaxId:
          type: string
          description: "${openapi.onboarding.institutions.model.legalTaxId}"
        requestDateTime:
          type: string
          description: "${openapi.onboarding.institutions.model.requestDateTime}"
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/BusinessResourceIC"
          description: "${openapi.onboarding.institutions.model.businesses}"
    InstitutionType:
      type: string
      enum:
      - PA
      - PG
      - GSP
      - SA
      - PT
      - SCP
      - PSP
      - AS
      - REC
      - CON
      - PRV
      - PRV_PF
      - GPU
      - SCEC
    InstitutionType1:
      type: string
      enum:
      - PA
      - PG
      - GSP
      - SA
      - PT
      - SCP
      - PSP
      - AS
      - REC
      - CON
      - PRV
      - PRV_PF
      - GPU
      - SCEC
      - DEFAULT
    InvalidParam:
      type: object
      properties:
        name:
          type: string
        reason:
          type: string
    IpaInstitutionResource:
      type: object
      properties:
        id:
          type: string
        originId:
          type: string
        o:
          type: string
        ou:
          type: string
        aoo:
          type: string
        taxCode:
          type: string
        category:
          type: string
        description:
          type: string
        digitalAddress:
          type: string
        address:
          type: string
        zipCode:
          type: string
        origin:
          type: string
        istatCode:
          type: string
    IpaInstitutionsSearchResource:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IpaInstitutionResource"
        count:
          type: integer
          format: int64
    LocalDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50
    MatchInfoResultResource:
      type: object
      properties:
        verificationResult:
          type: boolean
          description: "${openapi.onboarding.institutions.model.matchResult}"
    OffsetDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50-04:00
    OnboardingProductDto:
      type: object
      required:
      - users
      - institutionType
      - productId
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
          description: "${openapi.onboarding.institutions.model.users}"
          minItems: 1
        billingData:
          description: "${openapi.onboarding.institutions.model.billingData}"
          type: object
