services:
  mongo-db:
    image: mongo@sha256:1cb283500219e8fc0b61b328ea5a199a395a753d88b17351c58874fb425223cb
    ports:
      - "27017:27017"
    networks:
      - develop-network
    volumes:
      - "./db:/docker-entrypoint-initdb.d"
      - "./blobStorageInit/products.json:/fixtures/products.json:ro"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:0a47e12e3693483cef5c71f35468b91d751611f172d2f97414e9c69113b106d9
    ports:
      - "10010:10010"
      - "10011:10011"
      - "10012:10012"
    networks:
      - develop-network
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --blobPort 10010 --queuePort 10011 --tablePort 10012 --location /workspace --debug /workspace/debug.log"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCD9I1QhZT4gRjAAHEDPazjFIwtg==
    volumes:
      - ./storagedata:/workspace

  azure-cli:
    build:
      context: "."
      dockerfile: "Dockerfile-azure-cli"
    depends_on:
      - azurite
    volumes:
      - "./blobStorageInit/init_azurite.sh:/init_azurite.sh"
      - "./blobStorageInit/products.json:/workspace/products.json"
    environment:
      - SELFCARE_INFRA_PRIVATE_ENV=dev
    networks:
      - develop-network
    entrypoint: [ "sh", "/init_azurite.sh" ]

  onboarding-ms:
    image: ghcr.io/pagopa/selfcare-onboarding-ms@sha256:a4511530968aef0efa518f71ce14d78cd70cc4af4eb01b7303d50b85ccd5a70f
    ports:
      - "8085:8080"
    env_file:
      - test-onboarding-ms.env
    networks:
      - develop-network
    depends_on:
      - mongo-db
      - mock-server
      - azure-cli
      - azurite
      - institution-ms
      - product-ms

  user-ms:
    image: ghcr.io/pagopa/selfcare-user-ms:sha-f3cd392
    ports:
      - "8087:8080"
    env_file:
      - test-user-ms.env
    networks:
      - develop-network
    depends_on:
      - mongo-db
      - mock-server
      - azure-cli

  institution-ms:
    image: ghcr.io/pagopa/selfcare-institution-ms@sha256:2f71a454dfcdcf18e31070d79814992aac1acf71fb44face3db8a0381b5233b2
    ports:
      - "8082:8080"
    networks:
      - develop-network
    env_file:
      - test-institution-ms.env
    depends_on:
      - mongo-db
      - mock-server
      - azure-cli

  product-ms:
    image: ghcr.io/pagopa/selfcare-product-ms@sha256:9970fdba5a4bbdb84dbe4db261d199f6bf2c4543e6760c4b648a2b9e1b05cd73
    ports:
      - "9090:8080"
    networks:
      - develop-network
    env_file:
      - test-product-ms.env
    depends_on:
      - mongo-db

  mock-server:
    image: mockserver/mockserver@sha256:adec675a93253dcd503cda331dbc8c88383c1c79ceb2370ec9766ad3f010d255
    ports:
      - "1080:1080"
    networks:
      - develop-network
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/*.json
      - MOCKSERVER_ENABLE_CORS_FOR_API="true"
      - MOCKSERVER_ENABLE_CORS_FOR_ALL_RESPONSES="true"
    volumes:
      - "./mock:/config"

  fake-smtp:
    image: reachfive/fake-smtp-server@sha256:4b6d2f1e24481527de1429f88db18a377252a5e9e95bc083fa3d77e402cdadc8
    ports:
      - "1025:1025"
      - "8025:1080"
    networks:
      - develop-network


