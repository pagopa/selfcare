quarkus.http.port=8080
quarkus.application.name=contracts-crm-ms
## LOGGING ##
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n
## MONGODB ##
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE_NAME:selcContractsCrm}
%test.quarkus.mongodb.devservices.enabled=false
## HEALTH ##
quarkus.smallrye-health.root-path=/q/health
## SECURITY ##
# Incoming requests are webhook deliveries: JWTs signed by webhook-ms (issuer PAGOPA, audience selfcare-webhook).
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:}
mp.jwt.verify.issuer=${WEBHOOK_JWT_ISSUER:PAGOPA}
mp.jwt.verify.audiences=${WEBHOOK_JWT_AUDIENCE:selfcare-webhook}
## OPEN API ##
quarkus.smallrye-openapi.info-title=Contracts CRM API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Builds PSP contract delegations (membership and recipient) from SC-Delegations webhook notifications
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.smallrye-openapi.store-schema-directory=src/main/docs
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.swagger-ui.always-include=false
## CONTRACTS CRM ##
contracts-crm.tenant-id=${CONTRACTS_CRM_TENANT_ID:AR}
contracts-crm.topic=${CONTRACTS_CRM_TOPIC:SC-ContractsCRMDelegations}
contracts-crm.onboarding-status=${CONTRACTS_CRM_ONBOARDING_STATUS:COMPLETED}
contracts-crm.webhook-enabled=${CONTRACTS_CRM_WEBHOOK_ENABLED:true}
# Machine JWT used to call onboarding-ms (validated by selfcare-sdk-security: issuer SPID/PAGOPA, uid and tenant_id claims)
contracts-crm.machine-token.issuer=${JWT_TOKEN_ISSUER:SPID}
contracts-crm.machine-token.uid=contracts-crm-ms
contracts-crm.machine-token.duration=${JWT_TOKEN_DURATION:PT1H}
contracts-crm.machine-token.private-key=${JWT_TOKEN_PRIVATE_KEY:}
contracts-crm.machine-token.kid=${JWT_TOKEN_KID:}
## REST CLIENTS ##
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=200
quarkus.openapi-generator.codegen.validateSpec=false
# onboarding-ms
quarkus.openapi-generator.codegen.spec.onboarding_ms_json.mutiny=true
quarkus.openapi-generator.codegen.spec.onboarding_ms_json.additional-api-type-annotations=@org.eclipse.microprofile.rest.client.annotation.RegisterClientHeaders(it.pagopa.selfcare.contractscrm.client.auth.OnboardingHeadersFactory.class)
quarkus.openapi-generator.codegen.spec.onboarding_ms_json.enable-security-generation=false
quarkus.rest-client."org.openapi.quarkus.onboarding_ms_json.api.OnboardingControllerApi".url=${ONBOARDING_URL:http://localhost:8080}
# webhook-ms
quarkus.openapi-generator.codegen.spec.webhook_ms_json.mutiny=true
quarkus.openapi-generator.codegen.spec.webhook_ms_json.additional-model-type-annotations=@lombok.Builder; @lombok.NoArgsConstructor; @lombok.AllArgsConstructor
quarkus.openapi-generator.codegen.spec.webhook_ms_json.enable-security-generation=false
quarkus.rest-client."org.openapi.quarkus.webhook_ms_json.api.WebhookApi".url=${WEBHOOK_URL:http://localhost:8081}
quarkus.rest-client."org.openapi.quarkus.webhook_ms_json.api.WebhookApi".read-timeout=10000
# Event Hub (SAS key, or managed identity when EVENTHUB_SENDER_MANAGED_IDENTITY_CLIENT_ID is set)
quarkus.rest-client.event-hub.url=${EVENT_HUB_BASE_PATH:http://localhost:8082/}${EVENT_HUB_SC_CONTRACTS_CRM_DELEGATIONS_TOPIC:sc-contractscrmdelegations}
eventhub.rest-client.keyName=${SHARED_ACCESS_KEY_NAME:test}
eventhub.rest-client.key=${EVENTHUB_SC_CONTRACTSCRMDELEGATIONS_SELFCARE_WO_KEY_LC:test}
eventhub.sender.managed-identity-client-id=${EVENTHUB_SENDER_MANAGED_IDENTITY_CLIENT_ID:}
## JACOCO ##
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.excludes=org/openapi/**
