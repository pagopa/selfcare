quarkus.http.port=8080
#quarkus.smallrye-jwt.blocking-authentication=true
## JWT
#quarkus.http.auth.proactive=false
mp.jwt.verify.publickey=${JWT-PUBLIC-KEY:NONE}
smallrye.jwt.claims.sub=uid
#mp.jwt.verify.issuer=SPID
#smallrye.jwt.verify.key-format=JWK_BASE64URL
#smallrye.jwt.claims.groups=USER
#smallrye.jwt.path.sub=name
## OPEN API ##
quarkus.smallrye-openapi.info-title=User API
quarkus.smallrye-openapi.info-version=1.0.0
## Eventhub ##
quarkus.rest-client.event-hub.url=${EVENT_HUB_BASE_PATH:test}${EVENT_HUB_SC_USERS_TOPIC:sc-users}
eventhub.rest-client.keyName=${SHARED_ACCESS_KEY_NAME:test}
eventhub.rest-client.key=${EVENTHUB-SC-USERS-SELFCARE-WO-KEY-LC:test}
eventhub.sender.managed-identity-client-id=${EVENTHUB_SENDER_MANAGED_IDENTITY_CLIENT_ID:}
quarkus.rest-client.event-hub-fd.url=${EVENT_HUB_BASE_PATH:test}${EVENT_HUB_SELFCARE_FD_TOPIC:selfcare-fd}
eventhubfd.rest-client.keyName=${FD_SHARED_ACCESS_KEY_NAME:test}
eventhubfd.rest-client.key=${EVENTHUB_SELFCARE_FD_EXTERNAL_KEY_LC:test}
eventhubfd.sender.managed-identity-client-id=${EVENTHUBFD_SENDER_MANAGED_IDENTITY_CLIENT_ID:}
user-ms.webhook.topic=${USER_MS_WEBHOOK_TOPIC:SC-Users}
user-ms.eventhub.users.concurrency-level=${USER_MS_EVENTHUB_USERS_CONCURRENCY_LEVEL:1}
user-ms.eventhub.users.page-size=${USER_MS_EVENTHUB_USERS_PAGE_SIZE:50}
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n
quarkus.http.limits.max-form-attribute-size=4096
# Keep the literal JSON: nested JSON in a SmallRye expression default is not parsed correctly.
tenant.registry.json={"AR":{"mongo":{"account":"cosmos-ar","database":"selcUser","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_AR"},"storages":{"products":{"account":"selcdweuarcheckoutst01","container":"selc-d-product","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_AR_PRODUCT_CONNECTION_STRING"}}},"userRegistry":{"apiKeyEnvVar":"USER_REGISTRY_API_KEY_AR"}},"PNPG":{"mongo":{"account":"cosmos-pnpg","database":"selcUser","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_PNPG"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_PNPG"},"storages":{"products":{"account":"selcdweupnpgcheckoutst01","container":"selc-d-product","authentication":{"type":"CONNECTION_STRING","connectionStringEnvVar":"BLOB_STORAGE_PNPG_PRODUCT_CONNECTION_STRING"}}},"userRegistry":{"apiKeyEnvVar":"USER_REGISTRY_API_KEY_PNPG"}}}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR,PNPG}
tenant.enforcement.enabled=${TENANT_ENFORCEMENT_ENABLED:true}
tenant.default=${TENANT_DEFAULT:AR}
tenant.storage.mandatory-keys=products
tenant.user-registry.mandatory-tenants=${tenant.supported-tenants}
selfcare.tenant.resolution-filter.enabled=true
selfcare.tenant.resolution-filter.query-param-enabled=false
selfcare.tenant.strict-data-isolation=${SELFCARE_TENANT_STRICT_DATA_ISOLATION:false}
%test.tenant.enforcement.enabled=false
%test.tenant.default=AR
quarkus.mongodb.health.enabled=false
quarkus.index-dependency.selfcare-sdk-security.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-security.artifact-id=selfcare-sdk-security
quarkus.index-dependency.cucumber.group-id=it.pagopa.selfcare
quarkus.index-dependency.cucumber.artifact-id=selfcare-cucumber-sdk
quarkus.index-dependency.user-sdk-event.group-id=it.pagopa.selfcare
quarkus.index-dependency.user-sdk-event.artifact-id=selfcare-user-sdk-event
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
#quarkus.native.resources.includes=publicKey.pem
## AZURE STORAGE ##
user-ms.blob-storage.filepath-product=products.json
user-ms.products.refresh-interval=1m
%test.user-ms.products.preload-enabled=false
