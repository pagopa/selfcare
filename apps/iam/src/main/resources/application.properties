quarkus.http.port=8080
quarkus.banner.path=banner.txt
# mp.jwt.verify.publickey is a legacy fallback: JWTCallerPrincipalFactory prefers
# per-tenant keys from tenant.registry.json jwt.publicKeyEnvVar.
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:NONE}
smallrye.jwt.claims.sub=uid
#quarkus.smallrye-jwt.blocking-authentication=true
# NOTE: do not wrap tenant.registry.json in ${TENANT_REGISTRY_JSON:...}. SmallRye
# Config miscounts nested braces. The TENANT_REGISTRY_JSON env var still overrides
# this property via standard Quarkus env mapping.
tenant.registry.json={"AR":{"mongo":{"account":"cosmos-ar","database":"selcIam","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_AR"}},"PNPG":{"mongo":{"account":"cosmos-pnpg","database":"selcIam","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_PNPG"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_PNPG"}}}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR,PNPG}
tenant.enforcement.enabled=${TENANT_ENFORCEMENT_ENABLED:true}
%test.tenant.enforcement.enabled=false
tenant.default=${TENANT_DEFAULT:AR}
%test.tenant.default=AR
# When true, userClaims productRoles without tenantId are no longer visible.
# Keep false until the tenantId backfill has been executed and verified.
selfcare.tenant.strict-data-isolation=${SELFCARE_TENANT_STRICT_DATA_ISOLATION:false}
## Mongo
# Do not set quarkus.mongodb.connection-string or @MongoEntity(clientName):
# TenantMongoClientProducer replaces the default Panache client.
quarkus.mongodb.active=false
quarkus.mongodb.health.enabled=false
quarkus.index-dependency.selfcare-sdk-security.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-security.artifact-id=selfcare-sdk-security
quarkus.index-dependency.selfcare-sdk-tenant.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant.artifact-id=selfcare-sdk-tenant
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-tenant-mongodb.artifact-id=selfcare-sdk-tenant-mongodb
## JWT
quarkus.http.auth.proactive=false
## OPEN API ##
quarkus.smallrye-openapi.info-title=IAM API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} - %s%e%n
quarkus.http.limits.max-form-attribute-size=4096
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
#quarkus.native.resources.includes=publicKey.pem
## SIGNATURE
## Rest Client
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=200
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=ALL
## Codegen
quarkus.openapi-generator.codegen.validateSpec=false
quarkus.openapi-generator.codegen.spec.institution_json.mutiny=true
quarkus.openapi-generator.codegen.spec.institution_json.additional-model-type-annotations=@lombok.Builder; @lombok.NoArgsConstructor; @lombok.AllArgsConstructor
institution.api/mp-rest/url=${INSTITUTION_API_URL:http://localhost:8082}
quarkus.rest-client."org.openapi.quarkus.institution_openapi_json.api.InstitutionApi".url=${INSTITUTION_API_URL:http://localhost:8082}
quarkus.rest-client."org.openapi.quarkus.institution_openapi_json.api.InstitutionApi".providers=it.pagopa.selfcare.iam.filter.TokenPropagationFilter
## Jacoco
%test.quarkus.jacoco.includes=it/pagopa/selfcare/iam/controller/*,it/pagopa/selfcare/iam/service/**,it/pagopa/selfcare/iam/util/**,it/pagopa/selfcare/iam/filter/**,it/pagopa/selfcare/iam/repository/**,it/pagopa/selfcare/iam/exception/**
%test.quarkus.jacoco.data-file=target/jacoco.exec
quarkus.smallrye-openapi.store-schema-directory=src/main/docs
iam-ms.retry.min-backoff=${IAM_MS_RETRY_MIN_BACKOFF:5}
iam-ms.retry.max-backoff=${IAM_MS_RETRY_MAX_BACKOFF:60}
iam-ms.retry=${IAM_MS_RETRY:3}
iam-ms.appinsights.connection-string=${APPLICATIONINSIGHTS_CONNECTION_STRING:InstrumentationKey=00000000-0000-0000-0000-000000000000}
### ENCRYPTION
# One key/iv pair per supported tenant: SELFCARE_DATA_ENCRIPTION_KEY_<TENANT> and
# SELFCARE_DATA_ENCRIPTION_IV_<TENANT> (e.g. SELFCARE_DATA_ENCRIPTION_KEY_AR).
