quarkus.http.port=8080

#quarkus.smallrye-jwt.blocking-authentication=true

## JWT
# mp.jwt.verify.publickey is a legacy fallback: JWTCallerPrincipalFactory (selfcare-sdk-security)
# prefers the per-tenant key(s) referenced by tenant.registry.json "jwt.publicKeyEnvVar".
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:NONE}
smallrye.jwt.claims.sub=uid
# Index selfcare-sdk-security (no Jandex index in the jar) so JWTCallerPrincipalFactory,
# JWTSecurityIdentityAugmentor and JwtTenantValidationFilter are registered: SPID tokens must carry
# a tenant_id claim matching X-Tenant-Id (claim-less tokens default to PNPG in the SDK).
quarkus.index-dependency.selfcare-sdk-security.group-id=it.pagopa.selfcare
quarkus.index-dependency.selfcare-sdk-security.artifact-id=selfcare-sdk-security
## OPEN API ##
quarkus.smallrye-openapi.info-title=Document API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.open-api-version=3.0.3

quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) trace_id=%X{trace_id} span_id=%X{span_id} tenant=%X{tenant} - %s%e%n

## TENANT (Multitenant Step 2)
# Canonical tenant registry. Do not wrap it in ${TENANT_REGISTRY_JSON:...}: SmallRye Config
# miscounts nested braces. The TENANT_REGISTRY_JSON env var still overrides this property.
# Only AR is enabled; storages and signature sections are added by later Step 2 stories.
tenant.registry.json={"AR":{"mongo":{"account":"cosmos-ar","database":"selcDocument","connectionStringEnvVar":"MONGODB_CONNECTION_STRING_AR"},"jwt":{"publicKeyEnvVar":"JWT_PUBLIC_KEY_AR"}}}
tenant.supported-tenants=${TENANT_SUPPORTED_TENANTS:AR}
# Fail-closed: every business request must carry a valid X-Tenant-Id header. Disabling enforcement
# (rollout lever only) falls back to tenant.default when the header is missing.
tenant.enforcement.enabled=${TENANT_ENFORCEMENT_ENABLED:true}
tenant.default=${TENANT_DEFAULT:AR}
selfcare.tenant.strict-data-isolation=${SELFCARE_TENANT_STRICT_DATA_ISOLATION:false}
%test.tenant.enforcement.enabled=false
%test.tenant.default=AR

## MONGODB
# Do not set quarkus.mongodb.connection-string/database or @MongoEntity(clientName/database):
# TenantMongoClientProducer (selfcare-sdk-tenant-mongodb) replaces the default Panache client with
# a tenant-aware proxy and TenantMongoDatabaseResolver picks the database of the current tenant.

## HEALTH
# Explicit root-path for /q/health/{live,ready,started} — must match the path
# configured in Terraform (infra/resources/_modules/local-env/locals.tf).
quarkus.smallrye-health.root-path=/q/health
quarkus.mongodb.health.enabled=false

## DOCUMENT MAX SIZE UPLOAD
document-ms.upload.max-body-size=${DOCUMENT_MS_UPLOAD_MAX_BODY_SIZE:1M}
quarkus.http.limits.max-body-size=${document-ms.upload.max-body-size}


## SIGNATURE
document-ms.signature.verify-enabled=${SIGNATURE_VALIDATION_ENABLED:true}
document-ms.signature.eu-list-of-trusted-lists-url=https://ec.europa.eu/tools/lotl/eu-lotl.xml
document-ms.signature.eu-official-journal-url=https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=uriserv:OJ.C_.2019.276.01.0001.01.ENG
document-ms.pagopa-signature.source=${PAGOPA_SIGNATURE_SOURCE:disabled}
document-ms.pagopa-signature.signer=${PAGOPA_SIGNATURE_SIGNER:PagoPA S.p.A.}
document-ms.pagopa-signature.location=${PAGOPA_SIGNATURE_LOCATION:Roma}
document-ms.pagopa-signature.apply-onboarding-template-reason=${PAGOPA_SIGNATURE_ONBOARDING_REASON_TEMPLATE:Firma contratto adesione prodotto}

## Rest Client
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=50

quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO
quarkus.log.category."io.opentelemetry.javaagent.instrumentation.azurecore".level=ERROR

quarkus.smallrye-openapi.store-schema-directory=src/main/docs


quarkus.openapi-generator.codegen.spec.core_json.mutiny=true
quarkus.openapi-generator.codegen.spec.core_json.additional-model-type-annotations=@lombok.Builder; @lombok.NoArgsConstructor; @lombok.AllArgsConstructor
quarkus.openapi-generator.codegen.spec.core_json.enable-security-generation=false
quarkus.openapi-generator.codegen.spec.core_json.additional-api-type-annotations=@org.eclipse.microprofile.rest.client.annotation.RegisterClientHeaders(it.pagopa.selfcare.onboarding.client.auth.AuthenticationPropagationHeadersFactory.class)


mp.openapi.extensions.smallrye.operationIdStrategy=METHOD

## AZURE STORAGE ##
document-ms.blob-storage.path-contracts = parties/docs/
document-ms.blob-storage.path-deleted = parties/deleted/
document-ms.blob-storage.path-aggregates = parties/csv/aggregates/
## CONTRACTS
document-ms.blob-storage.container-contracts=${STORAGE_CONTAINER_CONTRACT:sc-d-documents-blob}
document-ms.blob-storage.connection-string-contracts = ${BLOB_STORAGE_CONTRACT_CONNECTION_STRING:}
document-ms.blob-storage.account-name-contracts = ${AZURE_STORAGE_ACCOUNT_NAME_CONTRACTS:}
## USER
document-ms.blob-storage.container-user = ${STORAGE_CONTAINER_USER:sc-d-usrattach-blob}
document-ms.blob-storage.connection-string-user = ${BLOB_STORAGE_USER_CONNECTION_STRING:}
document-ms.blob-storage.account-name-user = ${AZURE_STORAGE_ACCOUNT_NAME_USER:}
## MANAGED IDENTITY
document-ms.blob-storage.managed-identity-client-id = ${AZURE_CLIENT_ID:}

## Jacoco
%test.quarkus.jacoco.includes=it/pagopa/selfcare/document/controller/*,it/pagopa/selfcare/document/service/**,it/pagopa/selfcare/document/repository/**,it/pagopa/selfcare/document/health/**
%test.quarkus.jacoco.data-file=target/jacoco.exec

# HTTP Server Configuration - Timeout e Keep-Alive
quarkus.http.idle-timeout=${HTTP_IDLE_TIMEOUT:60s}
quarkus.http.read-timeout=${HTTP_READ_TIMEOUT:60s}
quarkus.http.so-reuse-port=${HTTP_SO_REUSE_PORT:true}
quarkus.http.tcp-quick-ack=${TCP_QUICK_ACK:true}
quarkus.http.tcp-cork=${HTTP_TCP_CORK:true}

# Vertx HTTP Options
quarkus.vertx.prefer-native-transport=${VERTX_PREFER_NATIVE_TRANSPORT:true}

# Configurazione Retry (Produzione/Sviluppo)
document-ms.retry.min-backoff-ms=500
document-ms.retry.max-backoff-ms=2000
document-ms.retry.max-attempts=3
