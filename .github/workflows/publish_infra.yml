name: Publish core infra

on:
  push:
    branches:
      - main
    paths:
      - "/infra/core/**"

  workflow_dispatch:
    inputs:
      env:
        required: true
        type: choice
        description: 'Select the Environment'
        default: 'dev'
        options: 
        - dev
        - uat
        - prod
      domain:
        required: true
        type: choice
        description: 'Select the Domain'
        default: 'ar'
        options: 
        - ar
        - pnpg

jobs:
  release_dev:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@3448c24fd46deea4a4a8cc6a0902641c448d2fb3 # main
    name: "DEV ${{ inputs.domain }} Selfcare Infra Core Release"
    if: ${{ inputs.env == 'dev' }}
    secrets: inherit
    with:
      environment: dev-${{ inputs.domain }}
      base_path: infra/core
      # env_vars: ""
      use_private_agent: true
      override_github_environment: ${{ inputs.env }}
      use_labels: true
      override_labels: ${{ inputs.env }}

  release_uat:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@3448c24fd46deea4a4a8cc6a0902641c448d2fb3 # main
    name: "UAT ${{ inputs.domain }} Selfcare Infra Core Release"
    if: ${{ inputs.env == 'uat' }}
    secrets: inherit
    with:
      environment: uat-${{ inputs.domain }}
      base_path: infra/core
      # env_vars: ""
      use_private_agent: true
      override_github_environment: ${{ inputs.env }}
      use_labels: true
      override_labels: ${{ inputs.env }}
  
  release_prod:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@3448c24fd46deea4a4a8cc6a0902641c448d2fb3 # main
    name: "PROD ${{ inputs.domain }} Selfcare Infra Core Release"
    if: ${{ inputs.env == 'prod' }}
    secrets: inherit
    with:
      environment: prod-${{ inputs.domain }}
      base_path: infra/core
      # env_vars: ""
      use_private_agent: true
      override_github_environment: ${{ inputs.env }}
      use_labels: true
      override_labels: ${{ inputs.env }}
