on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      environment_short:
        type: string
        required: true
      domain:
        type: string
        required: true
      agent:
        type: string
        required: true
      storage_account_name:
        required: true
        description: Storage account name
        type: string
      profile_name:
        required: true
        description: CDN profile name
        type: string
      endpoint_name:
        required: true
        description: CDN endpoint name
        type: string
      resource_group_name:
        required: true
        description: Resource group name
        type: string

env:
  STORAGE_ACCOUNT_NAME: "selc${{ inputs.environment_short }}${{ inputs.storage_account_name }}"
  STORAGE_CONTAINER: "$web"
  STORAGE_ACCOUNT_RG: "selc-${{ inputs.environment_short }}-checkout-fe-rg"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_STORAGE_USE_AZUREAD: true
  CDN_PROFILE: selc-${{ inputs.environment_short }}-${{ inputs.profile_name }}
  ENDPOINT_NAME: selc-${{ inputs.environment_short }}-${{ inputs.endpoint_name }}
  RESOURCE_GROUP: selc-${{ inputs.environment_short }}-${{ inputs.resource_group_name }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:

  publish:
    name: Publish static assets ${{ inputs.environment }}
    runs-on: ["${{ inputs.environment }}"]
    environment: ${{ inputs.environment }}-ci
    permissions:
      id-token: write
      contents: read

    steps:

    - name: Checkout
      id: checkout
      uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Cloud Login
      uses: pagopa/dx/actions/csp-login@main

    - name: Upload static assets to blob storage
      run: |
        az storage blob upload-batch \
          --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
          --auth-mode login \
          --source "./infra/core/static" \
          --destination '${{ env.STORAGE_CONTAINER }}/static' \
          --overwrite || { echo "Error uploading static assets."; exit 1; }
        echo "Upload success."

    - name: Purge blob storage static assets
      run: |
        az afd endpoint purge \
          --resource-group "${RESOURCE_GROUP}" \
          --endpoint-name "${ENDPOINT_NAME}" \
          --profile-name "${CDN_PROFILE}" \
          --content-paths "/static/*" || { echo "Error purging CDN endpoint."; exit 1; }
        echo "Purge success."

    - name: Azure Logout
      id: az_logout
      if: always()
      run: |
        az logout