name: Publish - Hub Spid PNPG Infra
run-name: Publish - Hub Spid PNPG Infra ${{ inputs.env }}

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Environment
        options:
          - dev
          - uat
          - prod
      release_version:
        type: string
        description: Hub-Sping-Login release version

jobs:
  release:
    name: '[${{ inputs.env }}] Hub Spid PNPG Infra Release'
    uses: ./.github/workflows/call_release_infra.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      environment: ${{ inputs.env }}
      tf_environment: ${{ inputs.env }}-pnpg
      dir: infra/resources/spid-login/${{ inputs.env }}-pnpg
      runner: self-hosted
