name: External MS - Swagger Detect Conflict and Update
on:
  pull_request:
    branches:
      - main
      - releases/*
    paths:
      - "src/**"
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  swagger_conflict_update:
    runs-on: ubuntu-24.04
    permissions: write-all
    name: Swagger Detect Rules and Conflict
    steps:
      - id: swagger-detect
        uses: pagopa/selfcare-commons/github-actions-template/swagger-detect-conflict-spring@efdc1a6deca2f704d6046a7f3adaa0afc2515f7a # main
        with:
          path_openapi_docs: src/main/resources/swagger/api-docs.json
          github_token: ${{ secrets.GITHUB_TOKEN }}