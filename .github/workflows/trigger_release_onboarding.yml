name: Onboarding - Trigger Release

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Environment
        options:
          - dev
          - uat
          - prod
        required: true
      branch:
        type: string
        description: Branch name
        required: true

jobs:
  release:
    name: "Trigger Release Workflows"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.branch }}

      - name: Extract Version
        id: extract
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          echo "version=$(echo "$INPUT_BRANCH" | sed 's/.*_//;s/^v//')" >> $GITHUB_OUTPUT

      - name: Trigger Functions Release
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_ENV: ${{ inputs.env }}
        run: |
          gh workflow run release_functions.yml \
            --ref "$INPUT_BRANCH" -f env="$INPUT_ENV" -f target=ar -f app=onboarding-functions

      - name: Trigger PNPG Functions Release
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_ENV: ${{ inputs.env }}
        run: |
          gh workflow run release_functions.yml \
            --ref "$INPUT_BRANCH" -f env="$INPUT_ENV" -f target=pnpg -f app=onboarding-functions

  release_onboarding_ms_ar:
    name: Release Onboarding MS (AR)
    needs: release
    uses: ./.github/workflows/call_release_app.yml
    with:
      env: ${{ inputs.env }}
      target: ar
      app: onboarding-ms
      APP_PATH: apps/onboarding-ms
      APPS_POM: apps/pom.xml
      POM: pom.xml
    secrets: inherit

  release_onboarding_cdc_ar:
    name: Release Onboarding CDC (AR)
    needs: release
    uses: ./.github/workflows/call_release_app.yml
    with:
      env: ${{ inputs.env }}
      target: ar
      app: onboarding-cdc
      APP_PATH: apps/onboarding-cdc
      APPS_POM: apps/pom.xml
      POM: pom.xml
    secrets: inherit

  release_onboarding_ms_pnpg:
    name: Release Onboarding MS (PNPG)
    needs: release
    uses: ./.github/workflows/call_release_app.yml
    with:
      env: ${{ inputs.env }}
      target: pnpg
      app: onboarding-ms
      APP_PATH: apps/onboarding-ms
      APPS_POM: apps/pom.xml
      POM: pom.xml
    secrets: inherit

  update_uat_variable:
    name: Update UAT Version Variable
    needs: [release, release_onboarding_ms_ar, release_onboarding_cdc_ar, release_onboarding_ms_pnpg]
    if: ${{ inputs.env == 'uat' }}
    uses: ./.github/workflows/call_update_gh_variable.yml
    with:
      domain: onboarding
      env: uat
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  update_prod_variable:
    name: "Update PROD Version Variable"
    needs: [release, release_onboarding_ms_ar, release_onboarding_cdc_ar, release_onboarding_ms_pnpg]
    if: ${{ inputs.env == 'prod' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/call_update_gh_variable.yml
    with:
      domain: onboarding
      env: prod
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
