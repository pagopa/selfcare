name: OpenAPI Verification

on:
  workflow_call:
    inputs:
      module:
        type: string
        required: true
      path_openapi_docs:
        type: string
        required: true
      base_path_openapi_docs:
        type: string
        required: false
        default: ""
        description: >-
          Path of the same OpenAPI document on the base branch, only when it differs from
          path_openapi_docs (the document moved): the diff then compares the two files

permissions:
  contents: read
  packages: read

jobs:
  openapi_conflict_update:
    runs-on: ubuntu-24.04
    name: OpenAPI Verification

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Configure Maven servers
        uses: s4u/maven-settings-action@7802f6aec16c9098b4798ad1f1d8ac75198194bd # v3.0.0
        with:
          servers: '[{"id": "selfcare", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}]'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Optic
        run: |
          mkdir -p optic-install
          cd optic-install

          npm init -y
          npm pkg set overrides.ajv="8.17.1"
          npm install @useoptic/optic@1.0.9

      - name: Resolve and fetch base branch
        id: base_branch
        run: |
          BASE_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
          git fetch origin "${BASE_BRANCH}"

      - name: Build OpenAPI source
        run: mvn --projects :${{ inputs.module }} --also-make package -DskipTests

      - name: Check OpenAPI with Optic
        env:
          BASE_BRANCH: ${{ steps.base_branch.outputs.branch }}
          HEAD_PATH: ${{ inputs.path_openapi_docs }}
          BASE_PATH: ${{ inputs.base_path_openapi_docs }}
        run: |
          set -euo pipefail
          optic=./optic-install/node_modules/.bin/optic
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "$HEAD_PATH" ]; then
            git show "origin/${BASE_BRANCH}:${BASE_PATH}" > "$RUNNER_TEMP/base-openapi.json"
            "$optic" diff "$RUNNER_TEMP/base-openapi.json" "$HEAD_PATH" --check
          else
            "$optic" diff "$HEAD_PATH" --base "origin/${BASE_BRANCH}" --check
          fi

      - name: Verify OpenAPI file is up to date
        env:
          HEAD_PATH: ${{ inputs.path_openapi_docs }}
        run: |
          if [ ! -f "$HEAD_PATH" ]; then
            echo "OpenAPI documentation $HEAD_PATH was not generated by the build."
            exit 1
          fi
          if ! git ls-files --error-unmatch "$HEAD_PATH" >/dev/null 2>&1; then
            echo "OpenAPI documentation $HEAD_PATH is not committed."
            exit 1
          fi
          if git diff --name-only HEAD | grep -Fxq "$HEAD_PATH"; then
            echo "OpenAPI documentation is outdated. Regenerate and commit $HEAD_PATH."
            exit 1
          fi
